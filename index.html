                      </button>

                      <p className="text-[10px] text-center text-slate-400 mt-2">
                        🔒 100% Privacy Protected. Your contact info will only be used by our academic coordination team.
                      </p>
                    </form>
                  </div>
                ) : (
                  <div className="text-center py-8">
                    <div className="w-16 h-16 rounded-full bg-emerald-900/80 text-emerald-300 border-2 border-emerald-500 flex items-center justify-center text-2xl mx-auto mb-4">
                      ✓
                    </div>
                    <h3 className="font-serif text-2xl font-bold text-white">JazakAllah Khayr!</h3>
                    <p className="text-sm text-slate-300 mt-2 max-w-sm mx-auto">
                      Your 3-Day Free Trial registration for <strong>{formData.studentName || 'your student'}</strong> has been received.
                    </p>
                    <div className="my-6 p-4 rounded-2xl bg-emerald-950/60 border border-emerald-800 text-xs text-emerald-300 text-left space-y-1">
                      <div>• <strong>Assigned Track:</strong> {formData.course}</div>
                      <div>• <strong>Tutor Preference:</strong> {formData.preferredTeacher}</div>
                      <div>• <strong>Next Step:</strong> Our coordinator will message you on WhatsApp at <strong>{formData.whatsapp}</strong> within 2 hours with available class times.</div>
                    </div>
                    <div className="flex gap-3 justify-center">
                      <a
                        href={`https://wa.me/923000000000?text=Salam%2C%20I%20just%20booked%20a%20trial%20for%20${encodeURIComponent(formData.studentName)}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-5 py-2.5 rounded-xl text-xs font-bold bg-[#25D366] text-white flex items-center gap-2 hover:bg-[#20ba59]"
                      >
                        <Icons.WhatsApp /> Connect Instantly on WhatsApp
                      </a>
                      <button
                        onClick={() => setModalOpen(false)}
                        className="px-4 py-2.5 rounded-xl text-xs font-semibold bg-emerald-900 text-emerald-200"
                      >
                        Close
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* Interactive Classroom Demo Modal */}
          {classroomOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="w-full max-w-3xl rounded-3xl bg-[#041e15] border border-emerald-700/80 p-6 sm:p-8 shadow-2xl relative">
                <button 
                  onClick={() => setClassroomOpen(false)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-white transition-colors"
                >
                  <Icons.Close />
                </button>
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-10 h-10 rounded-xl bg-emerald-900 text-amber-400 flex items-center justify-center font-bold">
                    <Icons.Video />
                  </div>
                  <div>
                    <h3 className="font-serif text-xl font-bold text-white">Noor-ul-Quran Virtual Classroom Suite</h3>
                    <p className="text-xs text-slate-400">Preview of our 1-on-1 teaching tools</p>
                  </div>
                </div>

                <div className="space-y-4 text-xs text-slate-300">
                  <div className="p-4 rounded-2xl bg-emerald-950/60 border border-emerald-800">
                    <div className="font-bold text-amber-300 mb-1">1. Quran Screen-Sharing & Digital Highlighting</div>
                    <p className="text-slate-300 text-[11px] leading-relaxed">
                      Teachers display authentic Uthmani script and color-coded Tajweed Mushaf. Every letter being articulated is highlighted with an interactive laser pointer so students never lose their place.
                    </p>
                  </div>

                  <div className="p-4 rounded-2xl bg-emerald-950/60 border border-emerald-800">
                    <div className="font-bold text-amber-300 mb-1">2. Makharij Visual Anatomical Charts</div>
                    <p className="text-slate-300 text-[11px] leading-relaxed">
                      For difficult Arabic letters (such as ض, ظ, ع, ح), our teachers use cross-sectional mouth diagrams to demonstrate exact tongue and vocal placement.
                    </p>
                  </div>

                  <div className="p-4 rounded-2xl bg-emerald-950/60 border border-emerald-800">
                    <div className="font-bold text-amber-300 mb-1">3. Video / Audio Discretion for Sisters</div>
                    <p className="text-slate-300 text-[11px] leading-relaxed">
                      Female students can choose audio-only mode or private video-on with female tutors, upholding complete Islamic Hijab and comfort.
                    </p>
                  </div>
                </div>

                <div className="mt-6 flex justify-end gap-3">
                  <button 
                    onClick={() => { setClassroomOpen(false); handleOpenBooking(); }}
                    className="px-6 py-2.5 rounded-xl text-xs font-bold bg-amber-400 text-slate-950 hover:bg-amber-300 transition-all"
                  >
                    Experience Live in a Free Trial
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
